<style>
/* ---- Material Design 3 color tokens (light) ---- */

  --md-sys-color-quaternary-container: var(--scheme-primary-container, #E9D5FF);

  --md-sys-color-on-error: #FFFFFF;
  --md-sys-color-error-container: #FFDAD6;

  --md-sys-color-surface: color-mix(in srgb, var(--scheme-primary, #4C1D95) 3%, white);
  --md-sys-color-on-surface: #1F1B26;
  --md-sys-color-surface-variant: color-mix(in srgb, var(--scheme-primary, #4C1D95) 10%, white);
  --md-sys-color-on-surface-variant: #5F5B66;
  --md-sys-color-surface-container: color-mix(in srgb, var(--scheme-primary, #4C1D95) 6%, white);
  --md-sys-color-surface-container-low: color-mix(in srgb, var(--scheme-primary, #4C1D95) 2%, white);
  --md-sys-color-surface-container-high: color-mix(in srgb, var(--scheme-primary, #4C1D95) 12%, white);
  --md-sys-color-inverse-surface: #1F1F21;
  --md-sys-color-inverse-on-surface: #F2F2F4;
  --md-sys-color-inverse-primary: #001D36;
  --md-sys-color-outline: #656A73;
  --md-sys-color-outline-variant: #C3C6CC;
}

/* ---- M3 motion + shape tokens (expressive spring → web curve fallback) ---- */
:root {
  --md-sys-motion-spatial-fast: cubic-bezier(0.42, 1.67, 0.21, 0.90);
  --md-sys-motion-spatial-default: cubic-bezier(0.38, 1.21, 0.22, 1.00);
  --md-sys-motion-effects-fast: cubic-bezier(0.31, 0.94, 0.34, 1.00);
  --md-sys-motion-effects-default: cubic-bezier(0.34, 0.80, 0.34, 1.00);
  --md-sys-motion-effects-slow: cubic-bezier(0.34, 0.88, 0.34, 1.00);
  --md-dur-fast: 150ms;
  --md-dur-default: 200ms;
  --md-dur-spatial: 350ms;
  --md-dur-spatial-default: 500ms;
  --md-shape-xs: 4px;
  --md-shape-sm: 8px;
  --md-shape-md: 12px;
  --md-shape-lg: 16px;
  --md-shape-lg-inc: 20px;
  --md-shape-xl: 28px;
  --md-shape-full: 999px;
  --md-sys-motion-spatial-smooth: cubic-bezier(0.22, 1.00, 0.30, 1.00);
  --md-dur-smooth: 900ms;
  --md-dur-effects-slow: 500ms;
}
/* ---- M3 typography: baseline + emphasized ---- */
.t-display-large { font-size: 24px; font-weight: 400; line-height: 30px; }
.t-display-medium { font-size: 18px; font-weight: 400; line-height: 24px; }
.t-display-small { font-size: 14px; font-weight: 400; line-height: 18px; }
.t-headline-large { font-size: 20px; font-weight: 400; line-height: 26px; }
.t-headline-medium { font-size: 16px; font-weight: 400; line-height: 20px; }
.t-headline-small { font-size: 13px; font-weight: 400; line-height: 16px; }
.t-title-large { font-size: 15px; font-weight: 400; line-height: 20px; }

.t-title-small { font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px; }
.t-body-large { font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: 0.5px; }

.t-body-small { font-size: 12px; font-weight: 400; line-height: 16px; letter-spacing: 0.4px; }
.t-label-large { font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px; }
.t-label-medium { font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: 0.5px; }
.t-label-small { font-size: 11px; font-weight: 500; line-height: 16px; letter-spacing: 0.5px; }
/* emphasized: same size/line-height, heavier weight (M3 Expressive) */
.t-emph.t-display-large, .t-emph.t-display-medium, .t-emph.t-display-small,
.t-emph.t-headline-large, .t-emph.t-headline-medium, .t-emph.t-headline-small,
.t-emph.t-title-large, .t-emph.t-body-large, .t-emph.t-body-medium, .t-emph.t-body-small { font-weight: 500; }
.t-emph.t-title-medium, .t-emph.t-title-small, .t-emph.t-label-large,
.t-emph.t-label-medium, .t-emph.t-label-small { font-weight: 700; }
.t-emph.t-display-large, .t-emph.t-display-medium, .t-emph.t-display-small,
.t-emph.t-headline-large, .t-emph.t-headline-medium, .t-emph.t-title-large { letter-spacing: 0; }

/* ---- layout ---- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; font-family: Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--md-sys-color-background); color: var(--md-sys-color-on-background); }
#app { height: 100dvh; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.material-icons { font-family: 'Material Symbols Outlined', sans-serif; font-size: 24px; line-height: 1; }
.top-app-bar { display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 12px 16px; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); border-bottom: 1px solid var(--md-sys-color-outline-variant); font-size: 14px; }
.top-app-bar__title { font-size: 20px; font-weight: 500; letter-spacing: 0; margin: 0; }
.top-app-bar .avatar { flex-shrink: 0; width: 40px !important; height: 40px !important; }
.screen-main { display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 24px; }
.grow { flex: 1; }
.empty-text { color: var(--md-sys-color-on-surface-variant); font-size: 13px; padding: 16px 0; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- buttons ---- */
/* M3 state layers: hover 8%, focus 10%, pressed 10% (effects spring, no overshoot) */
:where(.filled-button, .filled-tonal-button, .outlined-button, .text-button, .icon-button, .fab, .room-card, .job-card, .nav-item__pill, .grade-chip, .menu-item) { position: relative; isolation: isolate; }
:where(.filled-button, .filled-tonal-button, .outlined-button, .text-button, .icon-button, .fab, .room-card, .job-card, .nav-item__pill, .grade-chip, .menu-item)::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: currentColor;
  opacity: 0;
  pointer-events: none;
  z-index: -1;
  transition: opacity var(--md-dur-default) var(--md-sys-motion-effects-default);
}
:where(.filled-button, .filled-tonal-button, .outlined-button, .text-button, .icon-button, .fab, .room-card, .job-card, .nav-item__pill, .grade-chip, .menu-item):hover::after { opacity: 0.08; }
:where(.filled-button, .filled-tonal-button, .outlined-button, .text-button, .icon-button, .fab, .room-card, .job-card, .nav-item__pill, .grade-chip, .menu-item):focus-visible::after,
:where(.filled-button, .filled-tonal-button, .outlined-button, .text-button, .icon-button, .fab, .room-card, .job-card, .nav-item__pill, .grade-chip, .menu-item):active::after { opacity: 0.10; }
:where(button, a, [role="button"]):focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }

/* M3 buttons: fully rounded at all times; press uses a spatial spring instead of angular corners */
.filled-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: none; border-radius: var(--md-shape-full); background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.1px; cursor: pointer; touch-action: manipulation; transition: transform var(--md-dur-spatial) var(--md-sys-motion-spatial-fast); }
.filled-button:active, .filled-tonal-button:active, .outlined-button:active, .icon-button:active, .text-button:active { transform: scale(0.97); }
.filled-button:disabled { background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); }
.filled-tonal-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: none; border-radius: var(--md-shape-full); background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.1px; cursor: pointer; touch-action: manipulation; transition: transform var(--md-dur-spatial) var(--md-sys-motion-spatial-fast); }
.filled-button .material-icons, .filled-tonal-button .material-icons { font-size: 20px; }
.outlined-button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: var(--md-shape-full); background: transparent; color: var(--md-sys-color-on-surface-variant); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: transform var(--md-dur-spatial) var(--md-sys-motion-spatial-fast); }
.text-button { border: none; background: transparent; color: var(--md-sys-color-primary); font: inherit; font-size: 14px; font-weight: 500; padding: 12px 8px; cursor: pointer; transition: transform var(--md-dur-spatial) var(--md-sys-motion-spatial-fast); }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 12px; border: none; border-radius: var(--md-shape-full); background: transparent; color: var(--md-sys-color-on-surface-variant); cursor: pointer; transition: transform var(--md-dur-spatial) var(--md-sys-motion-spatial-fast); }
.icon-button .material-icons { font-size: 24px; }
.fab { position: fixed; right: 16px; bottom: 16px; width: 56px; height: 56px; border: none; border-radius: var(--md-shape-full); overflow: hidden; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 10px 0 rgba(0, 0, 0, 0.3), 0 1px 18px 0 rgba(0, 0, 0, 0.15); cursor: pointer; transition: transform var(--md-dur-spatial) var(--md-sys-motion-spatial-fast); }
.fab:active { transform: scale(0.94); }

/* ---- text fields ---- */
.textfield { position: relative; margin: 0 0 20px; }
.textfield__input { width: 100%; box-sizing: border-box; border: 2px solid var(--md-sys-color-outline-variant); border-radius: 20px; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); font: inherit; font-size: 14px; padding: 20px 12px 10px 12px; outline: none; transition: border-color var(--md-dur-default) var(--md-sys-motion-effects-default); }
.textfield__input::placeholder { color: var(--md-sys-color-on-surface-variant); }
.textfield__input:focus { border-color: var(--md-sys-color-primary); }
.textfield__label { position: absolute; left: 14px; top: 16px; font-size: 11px; color: var(--md-sys-color-on-surface-variant); background: var(--md-sys-color-surface); padding: 0 2px; pointer-events: none; white-space: nowrap; transition: top var(--md-dur-spatial) var(--md-sys-motion-spatial-fast), font-size var(--md-dur-spatial) var(--md-sys-motion-spatial-fast), color var(--md-dur-default) var(--md-sys-motion-effects-default); }
.textfield.has-value .textfield__label, .textfield:focus-within .textfield__label { top: 7px; font-size: 10px; color: var(--md-sys-color-on-surface-variant); }
.textfield:focus-within .textfield__label { color: var(--md-sys-color-primary); }
.textfield select.textfield__input { appearance: none; padding-right: 42px; }
textarea.textfield__input { resize: vertical; min-height: 84px; }
/* cards */
.card { background: var(--md-sys-color-surface); border-radius: 16px; padding: 16px; margin: 0 0 12px; box-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 3px 1px -2px rgba(0, 0, 0, 0.12), 0 1px 5px 0 rgba(0, 0, 0, 0.2); }
.card-heading { font-size: 14px; font-weight: 500; margin: 0 0 8px; }
.card-body { font-size: 13px; line-height: 18px; white-space: pre-wrap; }

/* job cards */
.job-card { background: var(--md-sys-color-surface); border-radius: 16px; padding: 14px; margin: 0 0 12px; box-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 3px 1px -2px rgba(0, 0, 0, 0.12), 0 1px 5px 0 rgba(0, 0, 0, 0.2); cursor: pointer; touch-action: manipulation; }
.job-card:active { opacity: 0.92; }
.job-card { transition: opacity var(--md-dur-default) var(--md-sys-motion-effects-default); }
.job-card__top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.job-card__subject { font-size: 11px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; }
.job-card__room { font-size: 11px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; }
.job-card__title { font-size: 15px; font-weight: 500; margin: 6px 0 4px; line-height: 20px; }
.job-card__meta { font-size: 11px; color: var(--md-sys-color-on-surface-variant); margin: 0 0 6px; }
.job-card__status { font-size: 11px; }
.status--error { color: var(--md-sys-color-error); }
.status--muted { color: var(--md-sys-color-on-surface-variant); }

/* forms */
.form-section { background: var(--md-sys-color-surface); border-radius: 16px; padding: 16px; margin: 0 0 12px; box-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 3px 1px -2px rgba(0, 0, 0, 0.12), 0 1px 5px 0 rgba(0, 0, 0, 0.2); }
.form-section__title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.form-row--two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#job-submit { margin-top: 8px; }

/* files & links */
.file-row { display: flex; align-items: center; gap: 8px; background: var(--md-sys-color-surface-container-low); border-radius: 12px; padding: 10px; margin: 8px 0; }
.file-row__link { display: inline-flex; align-items: center; gap: 6px; color: var(--md-sys-color-on-surface); font-size: 13px; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row__link .material-icons { font-size: 18px; flex-shrink: 0; }
.file-row__remove { margin-left: auto; }
.file-list-ul { list-style: none; margin: 0; padding: 0; }
.file-list-ul li { margin: 4px 0; }
.link-list-ul { list-style: none; margin: 0; padding: 0; }
.link-list-ul li { margin-bottom: 8px; }
.link-row__link { display: inline-flex; align-items: center; gap: 6px; color: var(--md-sys-color-primary); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }
.link-row__link .material-icons { font-size: 18px; flex-shrink: 0; }
.link-input { width: 100%; padding: 8px; border: 2px solid var(--md-sys-color-outline-variant); border-radius: 20px; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); font-size: 13px; transition: border-color var(--md-dur-default) var(--md-sys-motion-effects-default); }
.link-input:focus { outline: none; border-color: var(--md-sys-color-primary); }

/* detail */
.detail-title { font-size: 16px; font-weight: 500; margin: 0; }
.detail-meta { display: flex; flex-direction: column; gap: 8px; }
.detail-meta-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
.detail-meta-row .material-icons { font-size: 18px; flex-shrink: 0; color: var(--md-sys-color-primary); }
.detail-meta-row--error { color: var(--md-sys-color-error); }
.detail-meta-row--muted { color: var(--md-sys-color-on-surface-variant); }

/* profile */
.profile-avatar-wrap { text-align: center; padding: 12px 0 16px; }
.profile-avatar { width: 64px; height: 64px; font-size: 24px; }
.profile-upload { display: block; margin: 0 auto; }
.profile-sub { text-align: center; font-size: 11px; color: var(--md-sys-color-on-surface-variant); margin-top: 8px; }
.card .filled-tonal-button { margin-top: 12px; width: 100%; }

/* menu / flash / login */
.menu { position: fixed; z-index: 20; display: flex; flex-direction: column; min-width: 200px; max-width: calc(100vw - 16px); background: var(--md-sys-color-surface); border-radius: var(--md-shape-xl); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2), 0 6px 6px rgba(0, 0, 0, 0.1); padding: 8px 0; }
.menu[hidden] { display: none; }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 0 8px; border-radius: var(--md-shape-full); font-size: 14px; color: var(--md-sys-color-on-surface); cursor: pointer; }
.menu-item:active { background: var(--md-sys-color-surface-container); }
.flash { display: none; position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 16px); z-index: 50; background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface); font-size: 13px; border-radius: var(--md-shape-full); padding: 8px 16px; box-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.14), 0 3px 1px -2px rgba(0, 0, 0, 0.12), 0 1px 5px 0 rgba(0, 0, 0, 0.2); }
.flash--show { display: block; }
.login-screen { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100vh; }
.login-logo { font-size: 52px; color: var(--md-sys-color-primary); margin-top: 40px; }
.login-sub { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin: 0; }
.login-form { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.form-footer { margin-top: 8px; }

/* ---- M3 Expressive shape variety (token-based radii) ---- */
.fab.m3y-squircle {
  border-radius: 28px;
  transition: transform var(--md-dur-spatial) var(--md-sys-motion-spatial-fast);
}
.fab.m3y-squircle:active,
.fab.m3y-squircle.is-open { border-radius: 24px; }
.fab.m3y-squircle.is-open:active { transform: scale(0.94); }
.fab-menu { position: fixed; right: 16px; bottom: 164px; z-index: 16; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.fab-menu[hidden] { display: none; }
.fab-menu-item { min-height: 48px; padding: 0 20px; border: none; border-radius: var(--md-shape-full); font: inherit; font-size: 16px; font-weight: 500; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25); animation: m3-fade 200ms var(--md-sys-motion-effects-default) backwards, fab-rise 350ms var(--md-sys-motion-spatial-fast) backwards; }
.fab-menu-item:nth-child(2) { animation-delay: 40ms; }
.fab-menu-item:nth-child(3) { animation-delay: 80ms; }
@keyframes fab-rise { from { transform: translateY(16px) scale(0.9); } to { transform: translateY(0) scale(1); } }
.job-card:nth-child(odd), .job-card:nth-child(even) { border-radius: var(--md-shape-xl); }
.job-card__subject { font-size: 11px; white-space: nowrap; color: var(--md-sys-color-quaternary); }

/* ---- bottom navigation (M3 Expressive: selected item shows label) ---- */
.nav-bar {
  position: fixed;
  left: 8px;
  right: 8px;
  bottom: 12px;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 68px;
  padding: 6px 6px;
  background: var(--md-sys-color-surface-container);
  border-radius: var(--md-shape-xl);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  touch-action: pan-y;
  transition: transform 600ms var(--md-sys-motion-spatial-smooth);
  animation: m3-fade var(--md-dur-default) var(--md-sys-motion-effects-default),
             m3-rise var(--md-dur-spatial) var(--md-sys-motion-spatial-fast);
}
.nav-item {
  flex: 0 1 auto;
  min-width: 46px;
  min-height: 52px;
  padding: 0;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
}
.nav-item__pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 52px;
  max-width: 100%;
  padding: 0 8px;
  border-radius: var(--md-shape-full);
  color: var(--md-sys-color-on-surface-variant);
  /* spatial spring for the pill width (one axis); effects spring for color */

}

}

/* ---- grade chip + room grid ---- */

}
.room-card {
  --b1w: 72%; --b1h: 66%; --b1x: 48%; --b1y: -12%;
  --b1r: 42% 58% 70% 30% / 45% 35% 65% 55%;
  --b2w: 62%; --b2h: 58%; --b2x: -14%; --b2y: 58%;

  cursor: pointer;

}

@keyframes room-pop-in { from { transform: translateY(14px) scale(0.96); } to { transform: none; } }
.room-card.is-opening { z-index: 4; animation: room-pop 350ms var(--md-sys-motion-spatial-fast); }
@keyframes room-pop { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }
.room-card.is-swiping { transition: none !important; z-index: 3; background: transparent; border-color: transparent; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3); }

.room-blob { position: absolute; pointer-events: none; z-index: 0; }

.room-card__label { position: relative; z-index: 2; }
.room-card.shape-1 { --b1x: -12%; --b1y: -10%; --b1r: 62% 38% 55% 45% / 50% 58% 42% 50%; --b2x: 46%; --b2y: 56%; --b2r: 38% 62% 48% 52% / 60% 40% 60% 40%; }
.room-card.shape-2 { --b1x: 40%; --b1y: 50%; --b1r: 30% 70% 62% 38% / 40% 60% 40% 60%; --b2x: -10%; --b2y: -12%; --b2r: 70% 30% 40% 60% / 35% 65% 45% 55%; }
.room-card.shape-3 { --b1x: 52%; --b1y: -14%; --b1w: 60%; --b1h: 60%; --b1r: 50%; --b2o: 0; }
.room-card.shape-4 { --b1x: -16%; --b1y: 48%; --b1r: 48% 52% 65% 35% / 60% 45% 55% 40%; --b2x: 44%; --b2y: -14%; --b2r: 65% 35% 45% 55% / 45% 55% 45% 55%; }
.room-card.shape-5 { --b1x: 34%; --b1y: 34%; --b1w: 70%; --b1h: 70%; --b1r: 48% 52% 60% 40% / 55% 45% 60% 40%; --b2o: 0; }
.room-card.shape-6 { --b1x: -8%; --b1y: -16%; --b1w: 85%; --b1h: 55%; --b1r: 45% 55% 40% 60% / 55% 45% 60% 40%; --b2x: 30%; --b2y: 60%; --b2w: 55%; --b2h: 55%; --b2r: 50%; }
.room-card.shape-7 { --b1x: 55%; --b1y: 40%; --b1w: 58%; --b1h: 78%; --b1r: 45% 55% 35% 65% / 35% 65% 35% 65%; --b2o: 0; }
.room-card.shape-8 { --b1x: -18%; --b1y: 20%; --b1r: 35% 65% 40% 60% / 60% 35% 65% 40%; --b2x: 40%; --b2y: -18%; --b2r: 35% 65% 50% 50% / 60% 40% 60% 40%; }
.room-card.shape-9 { --b1x: 20%; --b1y: -20%; --b1w: 65%; --b1h: 65%; --b1r: 50%; --b2x: -20%; --b2y: 55%; --b2w: 70%; --b2h: 50%; --b2r: 70% 30% 45% 55% / 45% 55% 45% 55%; }
.room-card.shape-10 { --b1x: 48%; --b1y: 8%; --b1w: 70%; --b1h: 70%; --b1r: 28% 72% 45% 55% / 55% 45% 55% 45%; --b2o: 0; }
.room-card.shape-11 { --b1x: -14%; --b1y: -8%; --b1w: 75%; --b1h: 75%; --b1r: 40% 60% 50% 50% / 50% 50% 50% 50%; --b2x: 38%; --b2y: 52%; --b2w: 60%; --b2h: 60%; --b2r: 48% 52% 60% 40% / 55% 45% 55% 45%; }
.room-card.shape-12 { --b1x: 42%; --b1y: 44%; --b1w: 62%; --b1h: 62%; --b1r: 40% 60% 45% 55% / 50% 50% 55% 45%; --b2x: -12%; --b2y: -14%; --b2w: 62%; --b2h: 62%; --b2r: 40% 60% 60% 40% / 60% 40% 60% 40%; }

let remoteAccounts = [];
let listenersReady = { chats: false, messages: false };
let jobsSynced = false;
let auth = null;
let authUser = null;
let authReady = false;

function authEmailFor(username) {
  return encodeURIComponent(username) + '@fakjob.local';
}

function signInUser(username, password) {
  return auth.signInWithEmailAndPassword(authEmailFor(username), password);
}

function createUser(username, password) {
  return auth.createUserWithEmailAndPassword(authEmailFor(username), password);
}

function changeOwnPassword(newPassword) {
  return authUser.updatePassword(newPassword);
}

function signOutUser() {
  return auth.signOut();
}

function initFirestore() {
  try {
    if (typeof firebase === 'undefined') return false;
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    db = app.firestore();
    auth = app.auth();
    authUser = auth.currentUser;
    auth.onAuthStateChanged((u) => { authUser = u; authReady = true; });
    cloudReady = true;
    return true;
  } catch (e) { return false; }
}

function docData(doc) {
  return Object.assign({}, doc.data() || {});
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      account: state.account, jobs: state.jobs, followedRooms: state.followedRooms,
      likedIds: state.likedIds, chats: state.chats
    }));
  } catch (e) {}
}

function renderAfterRemoteChange() {
  const focus = document.activeElement;
  const typing = focus && (focus.tagName === 'INPUT' || focus.tagName === 'TEXTAREA');
  if (typing) return;
  if (screen === 'chatRoom') { refreshChatRoom(); return; }
  if (['home', 'dashboard', 'history', 'profile', 'viewProfile', 'chat', 'newChat'].indexOf(screen) !== -1) {
    render({ noAnim: true });
  }
}

function chatMetaOf(c) {
  return {
    type: c.type, privacy: c.privacy, name: c.name,
    members: Array.isArray(c.members) ? c.members : [],
    createdBy: c.createdBy || '', createdAt: c.createdAt || ''
  };
}

function applyRemoteChats() {
  if (!listenersReady.chats || !listenersReady.messages) return;
  const byId = new Map();
  remoteChatMeta.forEach((c) => byId.set(c.id, Object.assign({}, c, { messages: [] })));
  remoteMessages.forEach((m) => {
    const c = byId.get(m.chatId);
    if (c) c.messages.push(m);
  });
  const chats = Array.from(byId.values());
  chats.forEach((c) => {
    c.messages.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  });
  if (JSON.stringify(chats) !== JSON.stringify(state.chats)) {
    state.chats = chats;
    chats.forEach((c) => {
      pushedChats[c.id] = JSON.stringify(chatMetaOf(c));
      c.messages.forEach((m) => {
        pushedMsgs[m.id] = JSON.stringify(m);
        pushedMsgChat[m.id] = c.id;
      });
    });
    saveLocal();
    renderAfterRemoteChange();
  }
  if (pendingJoin) applyPendingJoin();
}

function startCloudListeners() {
  if (!cloudReady) return;
  const fail = () => { syncState = 'off'; updateSyncBadge(); };

  db.collection('jobs').onSnapshot((snap) => {
    jobsSynced = true;
    const jobs = snap.docs.map((d) => Object.assign({ id: d.id }, docData(d)));
    if (JSON.stringify(jobs) !== JSON.stringify(state.jobs)) {
      state.jobs = jobs;
      jobs.forEach((j) => { pushedJobs[j.id] = JSON.stringify(j); });
      Object.keys(pushedJobs).forEach((id) => { if (!jobs.some((j) => j.id === id)) delete pushedJobs[id]; });
      saveLocal();
      renderAfterRemoteChange();
    }
  }, fail);

  db.collection('chats').onSnapshot((snap) => {
    remoteChatMeta = snap.docs.map((d) => Object.assign({ id: d.id }, docData(d)));
    listenersReady.chats = true;
    applyRemoteChats();
  }, fail);

  db.collectionGroup('messages').onSnapshot((snap) => {
    remoteMessages = snap.docs.map((d) => Object.assign({ id: d.id, chatId: d.ref.parent.parent.id }, docData(d)));
    listenersReady.messages = true;
    applyRemoteChats();
  }, fail);

  db.collection('accounts').onSnapshot((snap) => {
    remoteAccounts = snap.docs.map((d) => Object.assign({ username: d.id }, docData(d)));
    knownAccounts = remoteAccounts;
    knownRows = remoteAccounts.map((a) => ({
      id: a.username,
      payload: { account: a, followedRooms: Array.isArray(a.followedRooms) ? a.followedRooms : [] }
    }));
    if (state.account) {
      const own = remoteAccounts.find((a) => a.username === state.account.username);
      if (own && !pushPending) {
        const acc = Object.assign({}, own);
        delete acc.followedRooms;
        delete acc.likedIds;
        if (JSON.stringify(acc) !== JSON.stringify(state.account)) {
          state.account = acc;
          saveLocal();
        }
      }
    }
    renderAfterRemoteChange();
  }, fail);
}

function syncRow() {
  return syncUser || (state.account ? state.account.username : SYNC_ROW);
}

function updateSyncBadge() {
  const badge = document.getElementById('sync-badge');
  if (badge) badge.textContent = syncState === 'on' ? '☁️ ซิงก์ข้อมูลออนไลน์' : '⚠️ ข้อมูลอยู่ในเครื่องเท่านั้น';
}

function mergeJobs(local, remote, deleted) {
  const map = new Map();
  (local || []).forEach((j) => { if (j && j.id) map.set(j.id, j); });
  (remote || []).forEach((j) => {
    if (!j || !j.id || deleted.indexOf(j.id) !== -1) return;
    const cur = map.get(j.id);
    const t = String(j.updatedAt || j.createdAt || '');
    if (!cur || t >= String(cur.updatedAt || cur.createdAt || '')) map.set(j.id, j);
  });
  return Array.from(map.values()).filter((j) => deleted.indexOf(j.id) === -1);
}

function mergeChats(local, remote, deleted) {
  const map = new Map();
  (local || []).forEach((c) => { if (c && c.id) map.set(c.id, c); });
  (remote || []).forEach((c) => {
    if (!c || !c.id || deleted.indexOf(c.id) !== -1) return;
    const lc = map.get(c.id);
    if (!lc) { map.set(c.id, c); return; }
    const members = Array.from(new Set((lc.members || []).concat(c.members || [])));
    const msgMap = new Map();
    (lc.messages || []).forEach((m) => { if (m && m.id) msgMap.set(m.id, m); });
    (c.messages || []).forEach((m) => { if (m && m.id && !msgMap.has(m.id)) msgMap.set(m.id, m); });
    const messages = Array.from(msgMap.values())
      .sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    map.set(c.id, Object.assign({}, c, lc, { members, messages }));
  });
  return Array.from(map.values()).filter((c) => deleted.indexOf(c.id) === -1);
}

async function cloudPull() {
  if (!cloudReady) initFirestore();
  if (cloudReady && !cloudPull.started) {
    cloudPull.started = true;
    syncState = 'on';
    startCloudListeners();
    updateSyncBadge();
  }
}

function scheduleCloudPush() {
  clearTimeout(pushTimer);
  pushPending = true;
  pushTimer = setTimeout(cloudPush, 700);
}

async function cloudPush() {
  if (!cloudReady) initFirestore();
  if (!cloudReady || !db || (!state.account && !syncUser)) { pushPending = false; return; }
  try {
    const batch = db.batch();
    let any = false;

    state.jobs.forEach((j) => {
      const sig = JSON.stringify(j);
      if (pushedJobs[j.id] !== sig) {
        const data = Object.assign({}, j);
        delete data.id;
        batch.set(db.collection('jobs').doc(j.id), data);
        pushedJobs[j.id] = sig;
        any = true;
      }
    });
    if (jobsSynced) {
      Object.keys(pushedJobs).forEach((id) => {
        if (!state.jobs.some((j) => j.id === id)) {
          batch.delete(db.collection('jobs').doc(id));
          delete pushedJobs[id];
          any = true;
        }
      });
    }

    state.chats.forEach((c) => {
      const meta = chatMetaOf(c);
      const sig = JSON.stringify(meta);
      if (pushedChats[c.id] !== sig) {
        batch.set(db.collection('chats').doc(c.id), meta);
        pushedChats[c.id] = sig;
        any = true;
      }
      (c.messages || []).forEach((m) => {
        const msig = JSON.stringify(m);
        if (pushedMsgs[m.id] !== msig) {
          const data = Object.assign({}, m);
          batch.set(db.collection('chats').doc(c.id).collection('messages').doc(m.id), data);
          pushedMsgs[m.id] = msig;
          pushedMsgChat[m.id] = c.id;
          any = true;
        }
      });
    });
    if (listenersReady.chats && listenersReady.messages) {
      Object.keys(pushedChats).forEach((id) => {
        if (!state.chats.some((c) => c.id === id)) {
        Object.keys(pushedMsgChat).forEach((mid) => {
          if (pushedMsgChat[mid] === id) {
            batch.delete(db.collection('chats').doc(id).collection('messages').doc(mid));
            delete pushedMsgs[mid];
            delete pushedMsgChat[mid];
          }
        });
        batch.delete(db.collection('chats').doc(id));
        delete pushedChats[id];
        any = true;
        }
      });
    }

    if (state.account) {
      const acc = Object.assign({}, state.account, {
        followedRooms: state.followedRooms, likedIds: state.likedIds
      });
      const sig = JSON.stringify(acc);
      if (pushedAccount !== sig) {
        const data = Object.assign({}, acc);
        delete data.username;
        batch.set(db.collection('accounts').doc(state.account.username), data, { merge: true });
        pushedAccount = sig;
        any = true;
      }
    }
    if (any) await batch.commit();
    syncState = 'on';
    pushPending = false;
    updateSyncBadge();
    return true;
  } catch (e) {
    syncState = 'off';
    pushPending = false;
    updateSyncBadge();
    return false;
  }
}

function isDesktopNav() {
  return !!(window.matchMedia && window.matchMedia('(min-width: 768px)').matches);
}

function isLiked(job) {
  return state.likedIds.indexOf(job.id) !== -1;
}

function isFollowed(grade, room) {
  return state.followedRooms.some((f) => f.grade === grade && f.room === room);
}

function toggleFollow(grade, room) {
  const i = state.followedRooms.findIndex((f) => f.grade === grade && f.room === room);
  if (i >= 0) state.followedRooms.splice(i, 1);
  else state.followedRooms.push({ grade, room });
  saveState();
  cloudPush();
  render({ noAnim: true });
}

function toggleLike(jobId) {
  if (!state.jobs.some((j) => j.id === jobId)) return;
  const i = state.likedIds.indexOf(jobId);
  if (i >= 0) state.likedIds.splice(i, 1);
  else state.likedIds.push(jobId);
  saveState();
  cloudPush();
  render({ noAnim: true });
  document.querySelectorAll('[data-like="' + jobId + '"] .material-icons').forEach((icon) => {
    icon.classList.remove('heart-pop');
    void icon.offsetWidth;
    icon.classList.add('heart-pop');
  });
}

/* ---- helpers ---- */
function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36) + '-' + ((h * 31) >>> 0).toString(36);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    state.account = parsed && parsed.account ? parsed.account : null;
    state.jobs = parsed && Array.isArray(parsed.jobs) ? parsed.jobs : [];
    state.followedRooms = parsed && Array.isArray(parsed.followedRooms) ? parsed.followedRooms : [];
    state.likedIds = parsed && Array.isArray(parsed.likedIds) ? parsed.likedIds : [];
    state.chats = parsed && Array.isArray(parsed.chats) ? parsed.chats : [];
    state.deletedJobIds = parsed && Array.isArray(parsed.deletedJobIds) ? parsed.deletedJobIds : [];
    state.deletedChatIds = parsed && Array.isArray(parsed.deletedChatIds) ? parsed.deletedChatIds : [];
  } catch (e) {
    state.account = null;
    state.jobs = [];
    state.chats = [];
    state.deletedJobIds = [];
    state.deletedChatIds = [];
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      account: state.account, jobs: state.jobs, followedRooms: state.followedRooms, likedIds: state.likedIds,
      chats: state.chats, deletedJobIds: state.deletedJobIds, deletedChatIds: state.deletedChatIds
    }));
  } catch (e) { /* storage unavailable */ }
  lastLocalChange = Date.now();
  scheduleCloudPush();
}

}

function syncTextfield(el) {
  const wrap = el.closest('.textfield');
  if (wrap) wrap.classList.toggle('has-value', !!el.value);
}

function syncTextfields() {

function roomsForGrade(grade) {
  if (!GRADES.includes(grade)) return [];
  const rooms = [];
  for (let i = 1; i <= ROOMS_PER_LEVEL; i++) rooms.push(String(i));
  return rooms;
}

function initials(account) {
  const name = (account.name || account.username || '').trim();
  const parts = name.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return parts[0][0] + parts[1][0];
  return parts[0] ? parts[0][0] : account.username[0];
}

function avatarColor(seed) {
  const colors = ['#6750A4', '#625B71', '#0061A4', '#00695C', '#37474F', '#795548', '#BF360C', '#43A047'];
  let sum = 0;
  for (const ch of (seed || '')) sum += ch.codePointAt(0);
  return colors[sum % colors.length];
}

function avatarHtml(cls, size) {
  const account = state.account;
  if (!account) return '';
  const pic = account.profilePic;
  const base = `width: ${size}px; height: ${size}px; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; font-weight: 500; border-radius: 50%;`;
  if (pic) {
    const crop = account.profilePicCrop;
    const cropStyle = crop
      ? `background-size: ${Math.round((crop.zoom || 1) * 100)}%; background-position: ${50 + (crop.x || 0) * 100}% ${50 + (crop.y || 0) * 100}%;`
      : '';
    return `<div class="avatar ${cls}" style="${base} ${cropStyle} background-image: url(&quot;${escapeHtml(pic)}&quot;);"></div>`;
  }
  return `<div class="avatar ${cls}" style="${base} background: ${avatarColor(account.username)}; color: #FFFFFF;">${escapeHtml(initials(account))}</div>`;
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(`${iso}T00:00:00`);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
}

function statusOf(job) {
  const todayStr = new Date().toISOString().slice(0, 10);
  if (!job.dueDate) return { text: 'ยังไม่ระบุวันส่ง', tone: 'muted' };
  if (job.dueDate < todayStr) return { text: 'เลยกำหนด', tone: 'error' };
  if (job.dueDate > todayStr) return { text: 'ยังไม่ถึงวันที่ส่ง', tone: 'muted' };
  return { text: 'ครบกำหนดวันนี้', tone: '' };
}

function fileToDataUrl(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

/* บีบรูปก่อนส่งแชท เพื่อไม่ให้ข้อมูลใน Firebase ใหญ่เกินไป */
function chatImageToDataUrl(file, maxSize, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const make = (max, q) => {
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          return canvas.toDataURL('image/jpeg', q);
        };
        let out = make(maxSize || 1280, quality || 0.82);
        if (out.length > 650000) out = make(900, 0.7);
        if (out.length > 650000) out = make(640, 0.6);
        resolve(out);
      };
      img.onerror = () => resolve(reader.result || '');
      img.src = reader.result;
    };
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

  syncTextfields();
  document.getElementById('login-form').addEventListener('submit', onLoginSubmit);
  document.getElementById('login-signup').addEventListener('click', () => go('signup'));
}

async function onLoginSubmit(e) {
  e.preventDefault();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if (!username) { setFlash('กรุณากรอกชื่อผู้ใช้'); return; }
  if (!password) { setFlash('กรุณากรอกรหัสผ่าน'); return; }

  let account = state.account && state.account.username === username ? state.account : null;
  let cloudPayload = null;
  try {
    if (!cloudReady) initFirestore();
    if (cloudReady) {
      const ownDoc = await db.collection('accounts').doc(username).get();
      if (ownDoc.exists) {
        const payload = ownDoc.data() || {};
        const acc = Object.assign({}, payload);
        delete acc.followedRooms;
        delete acc.likedIds;
        account = acc;
        cloudPayload = {
          account: acc,
          followedRooms: Array.isArray(payload.followedRooms) ? payload.followedRooms : [],
          likedIds: Array.isArray(payload.likedIds) ? payload.likedIds : []
        };
        pushedAccount = JSON.stringify(Object.assign({}, acc, {
          followedRooms: cloudPayload.followedRooms, likedIds: cloudPayload.likedIds
        }));
      }
    }
  } catch (err) { /* ใช้ข้อมูลในเครื่องเมื่อออฟไลน์ */ }

  if (!account && username === BOOTSTRAP_ACCOUNT.username) account = BOOTSTRAP_ACCOUNT;
  if (!account) { setFlash('ไม่พบบัญชีนี้'); return; }
  if (account.username !== username || hashStr(password) !== account.passwordHash) {
    setFlash('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    return;
  }
  if (cloudPayload) {
    state.followedRooms = Array.isArray(cloudPayload.followedRooms) ? cloudPayload.followedRooms : [];
    state.likedIds = Array.isArray(cloudPayload.likedIds) ? cloudPayload.likedIds : [];
  }
  state.account = account;
  syncUser = username;
  navTab = 'home';
  screen = 'home';
  saveState();
  render();
  applyPendingJoin();
}

async function onSignupSubmit(e) {
  e.preventDefault();
  const username = document.getElementById('signup-username').value.trim();
  const name = document.getElementById('signup-name').value.trim();
  const password = document.getElementById('signup-password').value;
  if (!username) { setFlash('กรุณากรอก Username'); return; }
  if (!name) { setFlash('กรุณากรอกชื่อ'); return; }
  if (password.length < 4) { setFlash('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'); return; }
  if (state.account && state.account.username === username) { setFlash('Username นี้ใช้แล้ว'); return; }
  try {
    if (!cloudReady) initFirestore();
    if (cloudReady) {
      const doc = await db.collection('accounts').doc(username).get();
      if (doc.exists) { setFlash('Username นี้ใช้แล้ว'); return; }
    }

function setNavActive(key) {
  document.querySelectorAll('#main-nav .nav-item').forEach((btn) => {
    const active = btn.dataset.nav === key;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', active ? 'true' : 'false');
    if (active) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
}

function bindBottomNav() {
  const bar = document.getElementById('main-nav');
  if (!bar || bar.dataset.bound === '1') return;
  bar.dataset.bound = '1';

  function navigate(key) {
    if (key === navTab) return;
    navTab = key;
    if (key === 'home') go('home');
    else if (key === 'work') { currentRoom = null; go('dashboard'); }
    else if (key === 'history') go('history');
    else if (key === 'chat') go('chat');
    else go('profile');
  }

  let startX = 0;
  let moved = false;
  let pointerHandled = false;
  let dragKey = null;

  function itemAt(x) {
    return Array.from(bar.querySelectorAll('.nav-item')).find((it) => {
      const rect = it.getBoundingClientRect();
      return x >= rect.left && x <= rect.right;
    });
  }

  function onMove(e) {
    if (Math.abs(e.clientX - startX) > 8) moved = true;
    if (!moved) return;
    bar.classList.add('is-dragging');
    const item = itemAt(e.clientX);
    const key = item ? item.dataset.nav : null;
    if (key && key !== dragKey) {
      dragKey = key;
      setNavActive(key);
    }
  }

  function cleanup() {
    bar.classList.remove('is-dragging');
    dragKey = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
  }

  function onUp(e) {
    cleanup();
    if (moved) {
      const item = itemAt(e.clientX);
      if (item) {
        pointerHandled = true;
        navigate(item.dataset.nav);
      } else {
        setNavActive(navTab);
      }
    }
  }

  function onCancel() {
    cleanup();
    setNavActive(navTab);
  }

  bar.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.nav-item')) return;
    pointerHandled = false;
    moved = false;
    dragKey = navTab;
    startX = e.clientX;
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  });

  bar.querySelectorAll('.nav-item').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (pointerHandled) { pointerHandled = false; return; }
      navigate(btn.dataset.nav);
    });
  });
}

function openProfileByName(name, from) {

function findProfileRow(wanted, name) {
  if (!knownRows.length) return null;
  const hasAcc = (r) => r.payload && r.payload.account;
  let row = wanted ? knownRows.find((r) => r.id === wanted) : null;
  if (!row && wanted) row = knownRows.find((r) => hasAcc(r) && r.payload.account.username === wanted);
  if (!row && name) row = knownRows.find((r) => hasAcc(r) && r.payload.account.name === name);
  return row;
}

function setViewProfile(row) {
  const acc = row.payload.account;
  viewProfile = {
    account: acc,
    followedRooms: Array.isArray(row.payload.followedRooms) ? row.payload.followedRooms : [],
    jobs: state.jobs.filter((j) => j.postedBy === acc.username)
  };
}

async function fetchProfileRow(username, from) {
  if (!username) return;
  try {
    if (!cloudReady) initFirestore();
    if (!cloudReady) return;
    const doc = await db.collection('accounts').doc(username).get();
    if (!doc.exists) return;
    const acc = Object.assign({ username }, doc.data() || {});
    const row = { id: username, payload: { account: acc, followedRooms: acc.followedRooms || [] } };
    knownRows = knownRows.filter((r) => r.id !== username).concat(row);
    if (!knownAccounts.some((a) => a.username === username)) knownAccounts.push(acc);
    viewFrom = from || screen;
    setViewProfile(row);
    go('viewProfile');
  } catch (e) { /* ออฟไลน์ */ }
}

/* เปิดทันทีจากข้อมูลที่โหลดไว้แล้ว ไม่ต้องโหลดฐานข้อมูลทั้งหมด */
function openProfileView(username, from, name) {
  const wanted = username || '';
  if (!wanted && !name) return false;
  viewFrom = from || screen;

  const row = findProfileRow(wanted, name);
  if (row && row.payload && row.payload.account) {
    setViewProfile(row);
    go('viewProfile');
    return true;
  }

  const localJob = state.jobs.find((j) => wanted && j.postedBy === wanted)
    || (name ? state.jobs.find((j) => j.postedByName === name) : null);
  if (localJob) {
    const user = wanted || localJob.postedBy;
    const acc = accountFor(user);
    viewProfile = {
      account: {
        username: user,
        name: localJob.postedByName || name || (acc && acc.name) || user,
        profilePic: localJob.postedByPic || (acc && acc.profilePic) || '',
        profilePicCrop: { zoom: 1, x: 0, y: 0 },
        profileBanner: (acc && acc.profileBanner) || ''
      },
      followedRooms: state.account && state.account.username === user ? state.followedRooms : [],
      jobs: state.jobs.filter((j) => j.postedBy === user)
    };
    go('viewProfile');
    return true;
  }

  const ownAcc = state.account && (state.account.username === wanted || (name && state.account.name === name)) ? state.account : null;
  if (ownAcc) {
    viewProfile = { account: ownAcc, followedRooms: state.followedRooms, jobs: state.jobs.filter((j) => j.postedBy === ownAcc.username) };
    go('viewProfile');
    return true;
  }

  if (wanted) fetchProfileRow(wanted, viewFrom);
  return false;
}

/* ---- chat helpers ---- */
function me() {
  return state.account ? state.account.username : '';
}

function chatId() {
  return 'chat-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
}

function currentChat() {
  return state.chats.find((c) => c.id === currentChatId) || null;
}

function chatJoinLink(chat) {
  return location.origin + location.pathname + '?join=' + encodeURIComponent(chat.id);
}

function applyPendingJoin() {
  if (!pendingJoin || !state.account) return;
  joinChatByLink(pendingJoin, true);
}

function joinChatByLink(value, fromPending) {
  if (!state.account) { pendingJoin = value; setFlash('เข้าสู่ระบบก่อนเข้าร่วมกลุ่มครับ'); return false; }
  let id = String(value || '').trim();
  if (!id) return false;
  const m = id.match(/[?&]join=([^&#]+)/);
  if (m) id = decodeURIComponent(m[1]);
  else if (/^https?:\/\//.test(id)) {
    try { id = new URL(id).searchParams.get('join') || id; } catch (e) {}
  }
  const chat = state.chats.find((c) => c.id === id);
  if (!chat) {
    if (fromPending) { setFlash('กำลังโหลดข้อมูลกลุ่ม...'); }
    else setFlash('ไม่พบกลุ่มนี้ ตรวจสอบลิ้งค์อีกครั้ง');
    return false;
  }
  pendingJoin = '';
  if (!Array.isArray(chat.members)) chat.members = [];
  if (chat.members.indexOf(me()) === -1) chat.members.push(me());
  saveState();
  openChatRoom(chat);
  setFlash('เข้าร่วมกลุ่มแล้ว');
  return true;
}

function lastChatTime(chat) {
  const msgs = Array.isArray(chat.messages) ? chat.messages : [];
  if (msgs.length && msgs[msgs.length - 1].createdAt) return Date.parse(msgs[msgs.length - 1].createdAt) || 0;
  return Date.parse(chat.createdAt) || 0;
}

function accountFor(username) {
  return knownAccounts.find((a) => a.username === username) || null;
}

function chatTitle(chat) {
  if (chat.type === 'group') return chat.name || 'กลุ่ม';
  const other = (chat.members || []).find((u) => u !== me());
  const acc = accountFor(other);
  return (acc && acc.name) || chat.name || other || 'แชท';
}

function chatAvatarHtml(chat, size) {
  const s = size || 44;
  const base = `width:${s}px;height:${s}px;flex-shrink:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background-size:cover;background-position:center;font-weight:600;font-size:${Math.round(s * 0.38)}px;`;
  if (chat.type === 'group') {
    return `<span class="chat-avatar" style="${base} background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);"><span class="material-icons" style="font-size:${Math.round(s * 0.5)}px">group</span></span>`;
  }
  const other = (chat.members || []).find((u) => u !== me());
  const acc = accountFor(other);
  const pic = (acc && acc.profilePic) || '';
  if (pic) return `<span class="chat-avatar" style="${base} background-image:url(&quot;${escapeHtml(pic)}&quot;)"></span>`;
  const name = (acc && acc.name) || chat.name || other || '?';
  return `<span class="chat-avatar" style="${base} background:${avatarColor(other || name)};color:#FFFFFF;">${escapeHtml(name.charAt(0))}</span>`;
}

function fmtChatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
}

function renderMessagesHtml(chat) {
  const msgs = Array.isArray(chat.messages) ? chat.messages : [];
  if (!msgs.length) return '<p class="empty-text chat-empty">ยังไม่มีข้อความ — เริ่มสนทนากันเลย</p>';
  return msgs.map((m) => {
    const mine = m.sender === me();
    const acc = accountFor(m.sender);
    const senderName = m.senderName || (acc && acc.name) || m.sender || 'ไม่ระบุ';
    const avatar = mine ? '' : (acc && acc.profilePic
      ? `<span class="chat-msg-avatar" style="background-image:url(&quot;${escapeHtml(acc.profilePic)}&quot;);background-size:cover;background-position:center"></span>`
      : `<span class="chat-msg-avatar" style="background:${avatarColor(m.sender || senderName)}">${escapeHtml(senderName.charAt(0))}</span>`);
    return `<div class="chat-row ${mine ? 'chat-row--mine' : ''}">
      ${avatar}
      <div class="chat-bubble">
        ${mine ? '' : `<div class="chat-bubble__sender">${escapeHtml(senderName)}</div>`}
        ${m.image ? `<img class="chat-bubble__image" src="${escapeHtml(m.image)}" alt="${escapeHtml(m.fileName || 'รูปภาพ')}" loading="lazy">` : ''}
        ${m.file ? `<a class="chat-bubble__file" href="${escapeHtml(m.file)}" download="${escapeHtml(m.fileName || 'file')}"><span class="material-icons">description</span><span>${escapeHtml(m.fileName || 'ไฟล์')}</span></a>` : ''}
        ${m.text ? `<div class="chat-bubble__text">${escapeHtml(m.text)}</div>` : ''}
        <div class="chat-bubble__time">${fmtChatTime(m.createdAt)}</div>
      </div>
    </div>`;
  }).join('');
}

function openChatRoom(chat) {
  if (!chat) return;
  currentChatId = chat.id;
  navTab = 'chat';
  go('chatRoom');
}

function startDirectChat(username, name) {
  if (!state.account || !username || username === me()) return;
  let chat = state.chats.find((c) => c.type === 'direct'
    && (c.members || []).indexOf(me()) !== -1
    && (c.members || []).indexOf(username) !== -1);
  if (!chat) {
    chat = {
      id: chatId(), type: 'direct', privacy: 'private',
      name: name || username, members: [me(), username],
      createdBy: me(), createdAt: new Date().toISOString(), messages: []
    };
    state.chats.unshift(chat);
    saveState();
  }
  openChatRoom(chat);
}

function createGroupChat(name, privacy, members) {
  if (!state.account || !name) return;
  const all = [me()];
  (members || []).forEach((u) => { if (u !== me() && all.indexOf(u) === -1) all.push(u); });
  const chat = {
    id: chatId(), type: 'group', privacy, name,
    members: all, createdBy: me(), createdAt: new Date().toISOString(), messages: []
  };
  state.chats.unshift(chat);
  newChatPrivacy = 'public';
  groupNameDraft = '';
  selectedMembers = [];
  saveState();
  openChatRoom(chat);
}

function leaveGroupChat() {
  const chat = currentChat();
  if (!chat || chat.type !== 'group' || !state.account) return;
  if (!window.confirm('ออกจากกลุ่มนี้หรือไม่?')) return;
  chat.members = (chat.members || []).filter((u) => u !== me());
  if (!chat.members.length) {
    state.chats = state.chats.filter((c) => c.id !== chat.id);
    if (state.deletedChatIds.indexOf(chat.id) === -1) state.deletedChatIds.push(chat.id);
  } else if (chat.createdBy === me()) chat.createdBy = chat.members[0];
  saveState();
  currentChatId = null;
  go('chat');
}

function toggleJoinGroup(id) {
  const chat = state.chats.find((c) => c.id === id);
  if (!chat || !state.account) return;
  const i = (chat.members || []).indexOf(me());
  if (i === -1) chat.members.push(me());
  else chat.members.splice(i, 1);
  saveState();
  render({ noAnim: true });
}

function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const chat = currentChat();
  if (!input || !chat || !state.account) return;
  const text = input.value.trim();
  if (!text) return;
  if (!Array.isArray(chat.messages)) chat.messages = [];
  chat.messages.push({
    id: 'msg-' + Date.now().toString(36),
    sender: me(),
    senderName: state.account.name || me(),
    text,
    createdAt: new Date().toISOString()
  });
  input.value = '';
  input.style.height = '';
  saveState();
  refreshChatRoom();
}

function sendChatFile(dataUrl, fileName, fileType, isImage) {
  const chat = currentChat();
  if (!chat || !state.account || !dataUrl) return;
  const input = document.getElementById('chat-input');
  const caption = input ? input.value.trim() : '';
  if (!Array.isArray(chat.messages)) chat.messages = [];
  const msg = {
    id: 'msg-' + Date.now().toString(36),
    sender: me(),
    senderName: state.account.name || me(),
    text: caption,
    fileName: fileName || '',
    fileType: fileType || '',
    createdAt: new Date().toISOString()
  };
  if (isImage) msg.image = dataUrl;
  else msg.file = dataUrl;
  chat.messages.push(msg);
  if (input) { input.value = ''; input.style.height = ''; }
  saveState();
  refreshChatRoom();
}

function sendChatImage(dataUrl, fileName) {

function refreshChatRoom() {
  const chat = currentChat();
  if (!chat) { render({ noAnim: true }); return; }
  const box = document.getElementById('chat-messages');
  if (box) {
    box.innerHTML = renderMessagesHtml(chat);
    box.scrollTop = box.scrollHeight;
    bindChatImages();
  }
  const title = document.getElementById('chat-room-title');
  if (title) title.textContent = chatTitle(chat);
  const sub = document.getElementById('chat-room-sub');
  if (sub) {
    sub.textContent = chat.type === 'group'
      ? `${(chat.members || []).length} สมาชิก · ${chat.privacy === 'public' ? 'สาธารณะ' : 'ส่วนตัว'}`
      : `@${(chat.members || []).find((u) => u !== me()) || ''}`;
  }
}

function renderChatHtml() {
  const myChats = state.chats.filter((c) => (c.members || []).indexOf(me()) !== -1)
    .sort((a, b) => lastChatTime(b) - lastChatTime(a));
  const publicGroups = state.chats.filter((c) => c.type === 'group' && c.privacy === 'public'
    && (c.members || []).indexOf(me()) === -1)
    .sort((a, b) => lastChatTime(b) - lastChatTime(a));
  const row = (chat, joinable) => {
    const msgs = Array.isArray(chat.messages) ? chat.messages : [];

function bindChat() {

      }

  if (joinLinkBtn) joinLinkBtn.addEventListener('click', () => {

function bindChatRoom() {
  const back = document.getElementById('chat-back');
  if (back) back.addEventListener('click', () => go('chat'));
  const form = document.getElementById('chat-form');
  if (form) form.addEventListener('submit', (e) => { e.preventDefault(); sendChatMessage(); });
  const input = document.getElementById('chat-input');
  if (input) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
  }
  const head = document.getElementById('chat-head');
  if (head) {
    const open = () => {
      const chat = currentChat();
      if (!chat || chat.type !== 'direct') return;
      const other = (chat.members || []).find((u) => u !== me());
      const acc = accountFor(other);
      const name = (acc && acc.name) || chat.name || '';
      const ok = openProfileView(other, 'chatRoom', name);
      if (!ok && name) openProfileByName(name, 'chatRoom');
    };
    head.addEventListener('click', open);
    head.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  }
  const linkBtn = document.getElementById('chat-link-btn');
  if (linkBtn) linkBtn.addEventListener('click', () => {
    const chat = currentChat();
    if (!chat) return;
    const link = chatJoinLink(chat);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link)
        .then(() => setFlash('คัดลอกลิ้งค์กลุ่มแล้ว'))
        .catch(() => window.prompt('ลิ้งค์กลุ่ม — กดก็อปปี้ได้เลย', link));
    } else {
      window.prompt('ลิ้งค์กลุ่ม — กดก็อปปี้ได้เลย', link);
    }
  });
  const leaveBtn = document.getElementById('chat-leave-btn');
  if (leaveBtn) leaveBtn.addEventListener('click', leaveGroupChat);
  const membersBtn = document.getElementById('chat-members-btn');
  if (membersBtn) membersBtn.addEventListener('click', showChatMembersDialog);
  const imageInput = document.getElementById('chat-image-input');
  if (imageInput) imageInput.addEventListener('change', () => {
    const file = imageInput.files && imageInput.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    setFlash('กำลังส่งรูปภาพ...');
    chatImageToDataUrl(file).then((dataUrl) => {
      imageInput.value = '';
      if (dataUrl) sendChatImage(dataUrl, file.name);
      setFlash('');
    });
  });
  const fileInput = document.getElementById('chat-file-input');
  if (fileInput) fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { setFlash('ไฟล์ใหญ่เกิน 3MB กรุณาใช้ไฟล์ที่เล็กกว่า'); return; }
    setFlash('กำลังส่งไฟล์...');
    fileToDataUrl(file).then((dataUrl) => {
      if (dataUrl) sendChatFile(dataUrl, file.name, file.type, false);
      setFlash('');
    });
  });
  const box = document.getElementById('chat-messages');
  if (box) { box.scrollTop = box.scrollHeight; bindChatImages(); }
}

function bindNewChat() {
  const back = document.getElementById('new-chat-back');
  if (back) back.addEventListener('click', () => go('chat'));
  document.querySelectorAll('[data-direct]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const a = accountFor(btn.dataset.direct);
      startDirectChat(btn.dataset.direct, a && a.name ? a.name : btn.dataset.direct);
    });
  });
  document.querySelectorAll('[data-privacy]').forEach((btn) => {
    btn.addEventListener('click', () => {
      newChatPrivacy = btn.dataset.privacy;
      const nameEl = document.getElementById('group-name');
      if (nameEl) groupNameDraft = nameEl.value;
      syncSelectedMembers();
      render({ noAnim: true });
    });
  });
  const name = document.getElementById('group-name');
  if (name) name.addEventListener('input', () => { groupNameDraft = name.value; });
  const create = document.getElementById('group-create');
  if (create) create.addEventListener('click', () => {
    syncSelectedMembers();
    const nameEl = document.getElementById('group-name');
    const n = (nameEl && nameEl.value || groupNameDraft).trim();
    if (!n) { setFlash('ใส่ชื่อกลุ่มก่อนครับ'); return; }
    createGroupChat(n, newChatPrivacy, selectedMembers);
  });
}

function bindDashboard() {
  document.getElementById('dash-avatar').addEventListener('click', () => { navTab = 'profile'; go('profile'); });
  const fabBtn = document.getElementById('add-job-btn');
  if (fabBtn) {
    fabBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      fabOpen = !fabOpen;
      const menu = document.getElementById('fab-menu');
      if (menu) menu.hidden = !fabOpen;
      fabBtn.classList.toggle('is-open', fabOpen);
      fabBtn.setAttribute('aria-label', fabOpen ? 'ปิดเมนู' : 'เพิ่มงาน');
      fabBtn.querySelector('.material-icons').textContent = fabOpen ? 'close' : 'add';
    });
    document.querySelectorAll('[data-fab-action]').forEach((action) => {
      action.addEventListener('click', (e) => {
        e.stopPropagation();
        fabOpen = false;
        newJobType = action.dataset.fabAction || 'work';
        go('addJob');
      });
    });
  } else {
    fabOpen = false;
  }

  const gradeChip = document.getElementById('grade-chip');
  gradeChip.addEventListener('click', () => {
    const menu = document.getElementById('grade-menu');
    if (!menu.hidden) { menu.hidden = true; return; }
    openMenu(gradeChip, menu);
  });
  document.querySelectorAll('#grade-menu .grade-option').forEach((opt) => {
    opt.addEventListener('click', () => {
      selectedGrade = opt.dataset.grade;
      currentRoom = null;
      document.getElementById('grade-menu').hidden = true;
      render();
    });
  });

  document.querySelectorAll('.room-card').forEach((card) => {
    let startX = 0;
    let startY = 0;
    let swiped = false;
    let activePointer = null;

    card.addEventListener('pointerdown', (e) => {
      activePointer = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      swiped = false;
    });

    card.addEventListener('pointermove', (e) => {
      if (activePointer !== e.pointerId) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
        card.classList.add('is-swiping');
        card.classList.toggle('swipe-left', dx < 0);
        const tx = Math.max(-120, Math.min(120, dx));
        card.style.transform = 'translateX(' + tx + 'px) rotate(' + (tx * 0.04) + 'deg) scale(0.98)';
        card.style.opacity = String(Math.max(0.55, 1 - Math.abs(dx) / 300));
      }
    });

    function endSwipe(e) {
      if (activePointer !== e.pointerId) return;
      activePointer = null;
      card.classList.remove('is-swiping', 'swipe-left');
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const canceledWithNoCoords = e.type === 'pointercancel' && !e.clientX && !e.clientY;
      if (!canceledWithNoCoords && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        swiped = true;
        const dir = dx > 0 ? 1 : -1;
        const grade = selectedGrade;
        const room = card.dataset.room;
        card.classList.add('is-leaving');
        card.style.transform = 'translateX(' + (dir * 70) + '%) rotate(' + (dir * 8) + 'deg)';
        card.style.opacity = '0';
        window.setTimeout(() => toggleFollow(grade, room), 260);
      } else {
        card.style.transform = '';
        card.style.opacity = '';
      }
    }

    card.addEventListener('pointerup', endSwipe);
    card.addEventListener('pointercancel', endSwipe);
    card.addEventListener('click', () => {
      if (swiped) { swiped = false; return; }
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      card.classList.add('is-opening');
      card.style.animationDelay = '0ms';
      const room = card.dataset.room;
      window.setTimeout(() => {
        currentRoom = room;
        render();
      }, reduce ? 0 : 170);
    });
  });

  const roomCards = document.querySelectorAll('.room-grid .room-card');
  if (roomCards.length) {
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        });
      }, { root: document.getElementById('app'), rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
      roomCards.forEach((card, i) => {
        card.classList.add('reveal');
        card.style.animationDelay = Math.min(i % 4, 3) * 30 + 'ms';
        observer.observe(card);
      });
    } else {
      roomCards.forEach((card) => card.classList.add('is-visible'));
    }
  }

  const roomBack = document.getElementById('room-back');
  if (roomBack) roomBack.addEventListener('click', () => { currentRoom = null; render(); });

  document.querySelectorAll('#jobs-list .job-card').forEach((card) => {
    card.addEventListener('click', () => { detailFrom = 'dashboard'; go('jobDetail', card.dataset.jobId); });
    const like = card.querySelector('.job-like');
    if (like) like.addEventListener('click', (e) => { e.stopPropagation(); toggleLike(card.dataset.jobId); });
    const poster = card.querySelector('.poster-chip');
    if (poster) poster.addEventListener('click', (e) => {
      e.stopPropagation();
      const job = state.jobs.find((j) => j.id === (poster.dataset.posterJob || card.dataset.jobId));
      if (job) openProfileView(job.postedBy, screen, job.postedByName);
    });
  });

  bindFilterChips();
  bindBottomNav();
}

function openMenu(anchor, menuEl) {
  menuEl.dataset.anchor = anchor.id;
  menuEl.hidden = false;
  const rect = anchor.getBoundingClientRect();
  const width = menuEl.offsetWidth || 200;
  const left = Math.min(rect.right - 8 - width, window.innerWidth - 16 - width);
  menuEl.style.left = Math.max(8, left) + 'px';
  menuEl.style.top = rect.bottom + 8 + 'px';
}

function bindJobDetail() {
  document.getElementById('detail-back').addEventListener('click', () => {
    if (detailFrom === 'viewProfile') { go('viewProfile'); }
    else if (detailFrom === 'home') { navTab = 'home'; go('home'); }
    else if (detailFrom === 'history') { navTab = 'history'; go('history'); }
    else { navTab = 'work'; go('dashboard'); }
  });
  const likeBtn = document.getElementById('job-like-btn');
  if (likeBtn) likeBtn.addEventListener('click', () => toggleLike(selectedJobId));
  const posterDetail = document.getElementById('poster-detail');
  if (posterDetail) posterDetail.addEventListener('click', () => {
    const job = state.jobs.find((j) => j.id === selectedJobId);
    if (job) openProfileView(job.postedBy, 'jobDetail', job.postedByName);
  });

  const commentInput = document.getElementById('comment-input');
  const commentSend = document.getElementById('comment-send');
  function sendComment() {
    if (!commentInput) return;
    const text = commentInput.value.trim();
    if (!text) { setFlash('กรุณาเขียนความเห็น'); return; }
    const job = state.jobs.find((j) => j.id === selectedJobId);
    if (!job) return;
    if (!Array.isArray(job.comments)) job.comments = [];
    job.comments.push({
      id: 'c-' + Date.now().toString(36),
      author: state.account ? (state.account.name || state.account.username) : 'guest',
      authorUser: state.account ? state.account.username : '',
      text,
      createdAt: new Date().toISOString()
    });
    saveState();
    cloudPush();
    render({ noAnim: true });
  }
  if (commentSend) commentSend.addEventListener('click', sendComment);
  document.querySelectorAll('.comment-author').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.commentName;
      let user = btn.dataset.commentUser;
      if (!user) {
        const job = state.jobs.find((j) => j.postedByName === name);
        user = job ? job.postedBy : '';
      }
      const ok = await openProfileView(user, 'jobDetail', name);
      if (!ok) openProfileByName(name, 'jobDetail');
    });
  });
  if (commentInput) commentInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendComment(); });
  const del = document.getElementById('job-delete');
  if (del) del.addEventListener('click', () => {
    const job = state.jobs.find((j) => j.id === selectedJobId);
    if (!job || !state.account || job.postedBy !== state.account.username) { setFlash('ลบได้เฉพาะงานของตัวเอง'); return; }
    if (!window.confirm('ลบงานนี้หรือไม่?')) return;
    state.jobs = state.jobs.filter((job) => job.id !== selectedJobId);
    if (state.deletedJobIds.indexOf(selectedJobId) === -1) state.deletedJobIds.push(selectedJobId);
    saveState();
    if (detailFrom === 'viewProfile') { go('viewProfile'); }
    else if (detailFrom === 'home') { navTab = 'home'; go('home'); }
    else if (detailFrom === 'history') { navTab = 'history'; go('history'); }
    else { navTab = 'work'; go('dashboard'); }
  });
}

function bindAddJob() {

  const otherInput = document.getElementById('job-subject-other');
  const gradeSel = document.getElementById('job-grade');

  if (gradeSel && roomSel) {
    gradeSel.value = selectedGrade;

      roomsForGrade(selectedGrade).map((r) => `<option value="${r}">ห้อง ${r}</option>`).join('');
    roomSel.value = currentRoom || roomsForGrade(selectedGrade)[0];
    syncTextfield(roomSel);
  }

  function syncSubjectWrap() {
    const show = subjectSel.value === 'other';
    otherWrap.hidden = !show;
    otherInput.required = false;
    if (show) syncTextfield(otherInput);
  }
  syncSubjectWrap();
  subjectSel.addEventListener('change', syncSubjectWrap);

  if (gradeSel && roomSel) {
    gradeSel.addEventListener('change', () => {
      const rooms = roomsForGrade(gradeSel.value);
      roomSel.innerHTML = '<option value="" disabled selected>เลือกห้อง</option>' + rooms.map((r) => `<option value="${r}">ห้อง ${r}</option>`).join('');
      roomSel.disabled = !gradeSel.value;
      if (gradeSel.value) roomSel.value = rooms[0];
    });

      const read = (file.type || '').startsWith('image/')
        ? chatImageToDataUrl(file, 1280, 0.8)
        : fileToDataUrl(file);
      read.then((dataUrl) => {
        if (!dataUrl) return;
        const row = document.createElement('div');
        row.className = 'file-row';
        const isImage = (file.type || '').startsWith('image/');
        const thumb = isImage ? `<img class="file-thumb" src="${escapeHtml(dataUrl)}" alt="">` : '';

        remove.className = 'icon-button file-row__remove';
        remove.setAttribute('aria-label', 'เอาไฟล์ออก');
        remove.innerHTML = '<span class="material-icons">close</span>';
        remove.addEventListener('click', () => row.remove());
        row.appendChild(remove);
        list.appendChild(row);
      });
    });
  }

  document.getElementById('job-add-files').addEventListener('click', () => document.getElementById('job-files-input').click());
  document.getElementById('job-files-input').addEventListener('change', addPickedFiles);
  document.getElementById('job-add-images').addEventListener('click', () => document.getElementById('job-images-input').click());

  document.getElementById('job-add-link').addEventListener('click', () => {
    const list = document.getElementById('job-links-list');

    row.className = 'link-row';
    const input = document.createElement('input');
    input.className = 'link-input';
    input.type = 'text';
    input.placeholder = 'ลิ้งค์ (เช่น https://example.com)';
    row.appendChild(input);
    const remove = document.createElement('button');
    remove.className = 'icon-button';
    remove.setAttribute('aria-label', 'เอาลิ้งค์ออก');
    remove.innerHTML = '<span class="material-icons">close</span>';
    remove.addEventListener('click', () => row.remove());
    row.appendChild(remove);
    list.appendChild(row);
  });

  document.getElementById('add-job-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const titleEl = document.getElementById('job-title');
    const title = titleEl ? titleEl.value.trim() : '';
    const subject = subjectSel.value === 'other' ? otherInput.value.trim() : subjectSel.value;
    const grade = gradeSel ? gradeSel.value : selectedGrade;
    const room = roomSel ? roomSel.value : currentRoom;
    const content = document.getElementById('job-content').value.trim();
    const answerEl = document.getElementById('job-answer');
    const answer = answerEl ? answerEl.value.trim() : '';
    const due = document.getElementById('job-due').value;
    const files = Array.from(document.querySelectorAll('#job-files-list .file-row__link')).map((a) => ({
      name: a.textContent.trim(),
      dataUrl: a.getAttribute('href') || '',
      type: a.getAttribute('data-type') || ''
    })).filter((f) => f.dataUrl);
    const links = Array.from(document.querySelectorAll('#job-links-list .link-input')).map((i) => ({ url: i.value.trim() })).filter((l) => l.url);
    const job = {
      id: 'job-' + Date.now().toString(36),
      type: newJobType,
      title: title || (newJobType === 'exam' ? 'นัดสอบ' : 'งานไม่มีชื่อ'),
      subject: subject || 'ไม่ระบุวิชา',
      subjectOther: subjectSel.value === 'other' ? subject : '',
      grade: grade || '',
      room: room || '',
      content: content || '',
      answer,
      dueDate: due,
      files,

      postedBy: state.account.username,
      postedByName: state.account.name || state.account.username,
      postedByPic: state.account.profilePic || '',
      createdAt: new Date().toISOString()
    };
    state.jobs.push(job);
    saveState();

    currentRoom = room || null;

    go('dashboard');
  });

  document.getElementById('add-back').addEventListener('click', () => go('dashboard'));

function bannerCssOf(src, crop) {
  if (!src) return '';

    ? `background-size: ${Math.round((crop.zoom || 1) * 100)}%; background-position: ${50 + (crop.x || 0) * 100}% ${50 + (crop.y || 0) * 100}%;`
    : 'background-size: cover; background-position: center;';
  return `background-image: url(&quot;${escapeHtml(src)}&quot;); ${sizing} background-repeat: no-repeat;`;
}

function updateBannerContrast() {
  const banner = document.querySelector('.profile-banner');
  if (!banner) return;
  const src = state.account && state.account.profileBanner;
  if (!src) {
    banner.classList.remove('banner-light', 'banner-dark');
    return;
  }
  const img = new Image();
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 16, 16);
      const data = ctx.getImageData(0, 0, 16, 16).data;
      let sum = 0;
      for (let i = 0; i < data.length; i += 4) {
        sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      }
      const light = sum / (data.length / 4) > 140;
      banner.classList.toggle('banner-light', light);
      banner.classList.toggle('banner-dark', !light);
    } catch (e) {
      banner.classList.add('banner-dark');
    }
  };
  img.onerror = () => banner.classList.add('banner-dark');
  img.src = src;
}

function updateProfileCollapse() {
  const app = document.getElementById('app');
  const banner = document.querySelector('.profile-banner');
  if (!app || !banner) return;
  const p = Math.max(0, Math.min(1, app.scrollTop / 90));
  banner.style.height = (128 - 72 * p) + 'px';
  banner.style.borderRadius = p > 0.02 ? '0 0 10px 10px' : '';
  const avatarBtn = banner.querySelector('.profile-avatar-btn');
  const avatar = banner.querySelector('.profile-avatar');
  const size = Math.round(96 - 56 * p);
  if (avatarBtn) { avatarBtn.style.width = size + 'px'; avatarBtn.style.height = size + 'px'; }
  if (avatar) { avatar.style.width = size + 'px'; avatar.style.height = size + 'px'; }
  const user = banner.querySelector('.profile-ident__user');
  if (user) user.style.opacity = String(1 - Math.min(1, p * 2));
  const name = banner.querySelector('.profile-ident__name');
  if (name) name.style.fontSize = (24 - 4 * p) + 'px';
  banner.style.opacity = '';
  banner.style.transform = '';
  banner.style.filter = '';
  banner.style.webkitMaskImage = '';
  banner.style.maskImage = '';
  const navBar = document.getElementById('main-nav');
  if (navBar && !isDesktopNav()) {
    const scrollingDown = app.scrollTop > lastProfileScroll;
    navBar.style.transform = app.scrollTop > 60 && scrollingDown ? 'translateY(140%)' : '';
  }
  lastProfileScroll = app.scrollTop;
}
